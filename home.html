<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payoo - Home</title>
    <link rel="stylesheet" href="styles/index.css" />
</head>

<body>
    <div class="phone-shell">
        <div class="phone-notch"></div>
        <div class="phone-screen">
            <div class="screen-scroll">

                <!-- Balance Header -->
                <div class="balance-header">
                    <div class="brand-row">
                        <span class="home-brand-name">💳 Payoo</span>
                        <div class="avatar">👤</div>
                    </div>
                    <div class="balance-label">Available Balance</div>
                    <div class="balance-amount">
                        <span class="balance-currency">$</span>
                        <span id="balance">4500</span>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="actions-wrap">
                    <button id="btn-toggle-add-money" class="action-btn btn-add">
                        <div class="btn-icon">➕</div>
                        Add Money
                    </button>
                    <button id="btn-toggle-cashout" class="action-btn btn-cashout">
                        <div class="btn-icon">💸</div>
                        Cash Out
                    </button>
                    <button id="btn-toggle-transaction" class="action-btn btn-history">
                        <div class="btn-icon">📋</div>
                        Transactions
                    </button>
                </div>

                <!-- Add Money Form -->
                <div id="add-money-form" class="panel">
                    <div class="panel-title">Add Money</div>
                    <form>
                        <label class="form-label" for="add-money">Amount</label>
                        <input id="add-money" class="form-input" type="number" placeholder="Enter amount" required />
                        <label class="form-label" for="pin">PIN</label>
                        <input id="pin" class="form-input" type="password" placeholder="4-digit PIN" maxlength="4"
                            autocomplete="off" required />
                        <button id="btn-add-money" class="submit-btn submit-add">Add Money</button>
                    </form>
                </div>

                <!-- Cashout Form -->
                <div id="cashout-form" class="panel hidden">
                    <div class="panel-title">Cash Out</div>
                    <form>
                        <label class="form-label" for="cashout">Amount</label>
                        <input id="cashout" class="form-input" type="number" placeholder="Enter amount" required />
                        <label class="form-label" for="cashout-pin">PIN</label>
                        <input id="cashout-pin" class="form-input" type="password" placeholder="4-digit PIN"
                            maxlength="4" autocomplete="off" required />
                        <button id="btn-cashout" class="submit-btn submit-cashout">Withdraw Money</button>
                    </form>
                </div>

                <!-- Transaction History -->
                <div id="transactions" class="hidden">
                    <div class="txn-header">Transaction History</div>
                    <div id="transaction-container"></div>
                </div>

            </div>
        </div>
    </div>

    <!-- javascript -->
    <script src="js/utilities.js"></script>
    <script src="js/addMoney.js"></script>
    <script src="js/cashOut.js"></script>
    <script src="js/features.js"></script>
</body>

</html>
